[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "edgar-moe"
version = "0.1.0"
description = "Regime-aware multimodal alpha research from SEC filings"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
authors = [{ name = "Hoang Nguyen" }]
dependencies = [
  "beautifulsoup4>=4.13,<5",
  "duckdb>=1.3,<2",
  "fastapi>=0.117,<1",
  "httpx>=0.28,<1",
  "numpy>=2.1,<3",
  "orjson>=3.10,<4",
  "pandas>=2.2,<3",
  "pandas-market-calendars>=5,<6",
  "polars>=1.32,<2",
  "pydantic>=2.11,<3",
  "pydantic-settings>=2.10,<3",
  "pyyaml>=6,<7",
  "scikit-learn>=1.6,<2",
  "scipy>=1.14,<2",
  "tenacity>=9,<10",
  "typer>=0.16,<1",
  "uvicorn>=0.35,<1",
]

[project.optional-dependencies]
research = [
  "cvxpy>=1.6,<2",
  "lightgbm>=4.6,<5",
  "mlflow-skinny>=3.3,<4",
  "torch>=2.7,<3",
  "transformers>=4.53,<5",
]
dev = [
  "mypy>=1.17,<2",
  "pytest>=8.4,<9",
  "pytest-asyncio>=1,<2",
  "pytest-cov>=6,<8",
  "respx>=0.22,<1",
  "ruff>=0.12,<1",
]

[project.scripts]
edgar-moe = "edgar_moe.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/edgar_moe"]

[tool.pytest.ini_options]
addopts = "-q --strict-markers --disable-warnings"
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
warn_unused_ignores = true

version: 2
updates:
  - package-ecosystem: gomod
    directory: /tools/evidence-auditor
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  # The uv ecosystem updates pyproject.toml and uv.lock together, so CI's
  # `uv sync --locked` accepts Dependabot's pull requests.
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # The forward runner embeds new filings with FinBERT for the frozen v1
      # model (ADR 0002). A transformers major can change tokenization or model
      # loading, so it needs a deliberate upgrade that shows the embeddings are
      # unchanged rather than an automated bump.
      - dependency-name: transformers
        update-types: ["version-update:semver-major"]
      # The frozen v1 checkpoint pickles scikit-learn 1.9.0 estimators
      # (ElasticNet, HistGradientBoostingRegressor, MLPRegressor). Loading them
      # under any other version raises InconsistentVersionWarning, and pickles
      # are not guaranteed across versions. Keep the frozen runtime on 1.9.0
      # until an upgrade is verified (#131).
      - dependency-name: scikit-learn
  - package-ecosystem: npm
    directory: /apps/web
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # react and react-dom must share one version or React throws at startup
      # (#127 bumped only react); their type packages move with them.
      react:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
    ignore:
      # Node types follow the runtime major in package.json `engines`; bump
      # them together with the runtime.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

version: 2
updates:
  - package-ecosystem: gomod
    directory: /tools/evidence-auditor
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  # The uv ecosystem updates pyproject.toml and uv.lock together, so CI's
  # `uv sync --locked` accepts Dependabot's pull requests.
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: npm
    directory: /apps/web
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

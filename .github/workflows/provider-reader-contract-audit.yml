name: Provider reader contract audit

on:
  workflow_dispatch:

concurrency:
  group: provider-reader-contract-audit
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  reader-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      AUDIT_DIR: reports/provider-reader-audit
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          python-version: "3.12"
          enable-cache: true

      - run: uv sync --locked --extra dev

      - name: Prepare redacted audit directory
        shell: bash
        run: mkdir -p "$AUDIT_DIR"

      - name: Require the deployed reader secret
        id: secret
        shell: bash
        env:
          EDGAR_MOE_REGISTRY_READ_DATABASE_URL: ${{ secrets.EDGAR_MOE_REGISTRY_READ_DATABASE_URL }}
        run: |
          set -euo pipefail
          if [[ -z "$EDGAR_MOE_REGISTRY_READ_DATABASE_URL" ]]; then
            cat > "$AUDIT_DIR/summary.json" <<'JSON'
          {
            "status": "not_run",
            "reason": "EDGAR_MOE_REGISTRY_READ_DATABASE_URL is not configured"
          }
          JSON
            echo "Configure the EDGAR_MOE_REGISTRY_READ_DATABASE_URL Actions secret before running this audit." >&2
            exit 1
          fi

      - name: Run the effective reader-role verifier
        id: audit
        if: ${{ always() && steps.secret.outcome == 'success' }}
        shell: bash
        env:
          EDGAR_MOE_REGISTRY_READ_DATABASE_URL: ${{ secrets.EDGAR_MOE_REGISTRY_READ_DATABASE_URL }}
        run: |
          set +e
          uv run python scripts/verify_postgres_reader.py \
            > "$AUDIT_DIR/reader-role.json" \
            2> "$AUDIT_DIR/reader-role.error"
          exit_code=$?
          set -e

          if [[ "$exit_code" -eq 0 ]]; then
            status=passed
          else
            status=failed
          fi

          AUDIT_STATUS="$status" \
          AUDIT_EXIT_CODE="$exit_code" \
          AUDIT_RUN_ID="$GITHUB_RUN_ID" \
          AUDIT_RUN_ATTEMPT="$GITHUB_RUN_ATTEMPT" \
          AUDIT_SHA="$GITHUB_SHA" \
          uv run python - <<'PY'
          import json
          import os
          from datetime import UTC, datetime
          from pathlib import Path

          payload = {
              "status": os.environ["AUDIT_STATUS"],
              "exit_code": int(os.environ["AUDIT_EXIT_CODE"]),
              "workflow": "provider-reader-contract-audit",
              "run_id": os.environ["AUDIT_RUN_ID"],
              "run_attempt": os.environ["AUDIT_RUN_ATTEMPT"],
              "commit": os.environ["AUDIT_SHA"],
              "finished_at": datetime.now(UTC).isoformat(),
              "reader_report": "reader-role.json",
              "error_report": "reader-role.error",
          }
          Path(os.environ["AUDIT_DIR"], "summary.json").write_text(
              json.dumps(payload, indent=2, sort_keys=True) + "\n", encoding="utf-8"
          )
          PY
          echo "exit_code=$exit_code" >> "$GITHUB_OUTPUT"

      - name: Hash audit evidence
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          sha256sum "$AUDIT_DIR"/* | sort > "$AUDIT_DIR/SHA256SUMS"

      - name: Verify retained evidence is redacted
        id: redaction
        if: ${{ always() }}
        run: uv run python scripts/validate_redacted_artifacts.py --root "$AUDIT_DIR"

      - name: Upload redacted provider audit evidence
        if: ${{ always() && steps.redaction.outcome == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: provider-reader-contract-${{ github.run_id }}-${{ github.run_attempt }}
          path: reports/provider-reader-audit/
          if-no-files-found: error
          retention-days: 30

      - name: Fail unless the provider contract passed
        if: ${{ always() && (steps.secret.outcome != 'success' || steps.audit.outputs.exit_code != '0' || steps.redaction.outcome != 'success') }}
        shell: bash
        run: |
          echo "Provider reader-role contract audit did not pass; inspect the retained artifact." >&2
          exit 1

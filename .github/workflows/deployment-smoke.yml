name: Deployment smoke check

on:
  deployment_status:
  workflow_dispatch:
    inputs:
      deployment_url:
        description: "HTTPS origin to probe (for example, the current Vercel deployment URL)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: edgar-moe-deployment-smoke
  cancel-in-progress: true

jobs:
  smoke:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'deployment_status' &&
      github.event.deployment_status.state == 'success' &&
      github.event.deployment.environment == 'Production' &&
      startsWith(github.event.deployment_status.target_url, 'https://'))
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --locked --extra dev
      - name: Probe the public deployment boundary
        env:
          DEPLOYMENT_URL: >-
            ${{ github.event_name == 'workflow_dispatch' && inputs.deployment_url ||
            vars.EDGAR_MOE_PUBLIC_DEPLOYMENT_URL ||
            github.event.deployment_status.target_url }}
        run: |
          mkdir -p reports/deployment-smoke
          # The checkout is the deployed commit (or main for a manual recheck), so
          # its reviewed lock is the identity production must serve.
          uv run python scripts/smoke_deployment.py \
            "$DEPLOYMENT_URL" \
            --expect-lock config/public_snapshot.lock.json \
            --output reports/deployment-smoke/smoke.json
      - name: Upload smoke evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: deployment-smoke-${{ github.run_id }}
          path: reports/deployment-smoke/smoke.json
          if-no-files-found: ignore
          retention-days: 30

  record-failed-deployment:
    if: >-
      github.event_name == 'deployment_status' &&
      github.event.deployment.environment == 'Production' &&
      (github.event.deployment_status.state == 'failure' ||
      github.event.deployment_status.state == 'error' ||
      github.event.deployment_status.state == 'inactive')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Write redacted deployment failure evidence
        env:
          DEPLOYMENT_STATE: ${{ github.event.deployment_status.state }}
          DEPLOYMENT_ENVIRONMENT: ${{ github.event.deployment.environment }}
          DEPLOYMENT_SHA: ${{ github.event.deployment.sha }}
          DEPLOYMENT_ID: ${{ github.event.deployment.id }}
          DEPLOYMENT_STATUS_ID: ${{ github.event.deployment_status.id }}
          DEPLOYMENT_URL: ${{ github.event.deployment_status.target_url }}
        run: |
          python3 scripts/write_deployment_failure_evidence.py \
            --output reports/deployment-smoke/deployment-failure.json
      - name: Upload deployment failure evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: deployment-failure-${{ github.run_id }}
          path: reports/deployment-smoke/deployment-failure.json
          if-no-files-found: error
          retention-days: 30
      - name: Fail the deployment gate
        run: |
          echo "Production deployment status was $DEPLOYMENT_STATE; inspect the retained failure artifact." >&2
          exit 1
        env:
          DEPLOYMENT_STATE: ${{ github.event.deployment_status.state }}

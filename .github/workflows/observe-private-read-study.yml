name: Bounded private hosted read study

on:
  workflow_dispatch:
    inputs:
      scheduled_at:
        description: Signed nominal UTC time for external delivery
        type: string
      signature:
        description: Observation-specific HMAC
        type: string
  schedule:
    - cron: "41 * * * *"

permissions:
  contents: read

concurrency:
  group: ${{ vars.ISSUE290_STUDY_DELIVERY_MODE == 'cloudflare' && github.event_name == 'schedule' && 'portfolio-private-study290-inactive-schedule' || 'portfolio-private-study290-observation' }}
  cancel-in-progress: false

jobs:
  admit-signed-slot:
    if: ${{ github.repository == 'hoangnguyen2003/edgar-moe' && github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && vars.ISSUE290_STUDY_ENABLED == 'true' && vars.ISSUE290_STUDY_DELIVERY_MODE == 'cloudflare' && inputs.scheduled_at != '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    environment: hosted-read-study
    outputs:
      scheduled_at: ${{ steps.claim.outputs.scheduled_at }}
      starts_at: ${{ steps.claim.outputs.starts_at }}
      expires_at: ${{ steps.claim.outputs.expires_at }}
      policy_sha256: ${{ steps.claim.outputs.policy_sha256 }}
      host_sha256: ${{ steps.claim.outputs.host_sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify signed delivery and reserve one observation slot
        id: claim
        env:
          STUDY_STARTS_AT: ${{ vars.STUDY_STARTS_AT }}
          STUDY_EXPIRES_AT: ${{ vars.STUDY_EXPIRES_AT }}
          STUDY_POLICY_SHA256: ${{ vars.STUDY_POLICY_SHA256 }}
          STUDY_DEPLOYMENT_HOST_SHA256: ${{ vars.STUDY_DEPLOYMENT_HOST_SHA256 }}
          STUDY_OBSERVATION_SIGNING_KEY: ${{ secrets.STUDY_OBSERVATION_SIGNING_KEY }}
          STUDY_CLAIM_R2_ACCOUNT_ID: ${{ secrets.STUDY_CLAIM_R2_ACCOUNT_ID }}
          STUDY_CLAIM_R2_ACCESS_KEY_ID: ${{ secrets.STUDY_CLAIM_R2_ACCESS_KEY_ID }}
          STUDY_CLAIM_R2_SECRET_ACCESS_KEY: ${{ secrets.STUDY_CLAIM_R2_SECRET_ACCESS_KEY }}
        run: python3 -m scripts.admit_study_observation >> "$GITHUB_OUTPUT"

  observe:
    # Missing flag is dormant. Enabling requires a freshly bound seven-day
    # study, SELECT-only credential, hosting/plan review and a private preview.
    needs: admit-signed-slot
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' && vars.ISSUE290_STUDY_ENABLED == 'true' && (vars.ISSUE290_STUDY_DELIVERY_MODE == '' || (needs.admit-signed-slot.result == 'success' && needs.admit-signed-slot.outputs.scheduled_at != '')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment:
      name: hosted-read-study
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check the absolute study window before using credentials
        id: window
        env:
          STUDY_STARTS_AT: ${{ needs.admit-signed-slot.outputs.starts_at || vars.STUDY_STARTS_AT }}
          STUDY_EXPIRES_AT: ${{ needs.admit-signed-slot.outputs.expires_at || vars.STUDY_EXPIRES_AT }}
          STUDY_SCHEDULED_AT: ${{ needs.admit-signed-slot.outputs.scheduled_at }}
        run: python3 -m scripts.observe_private_read_study --check-window >> "$GITHUB_OUTPUT"
      - name: Capture endpoint state without waking Postgres
        if: ${{ steps.window.outputs.eligible == 'true' }}
        env:
          STUDY_NEON_METADATA_KEY: ${{ secrets.STUDY_NEON_METADATA_KEY }}
          STUDY_NEON_PROJECT_ID: ${{ secrets.STUDY_NEON_PROJECT_ID }}
          STUDY_NEON_ENDPOINT_ID: ${{ secrets.STUDY_NEON_ENDPOINT_ID }}
        run: python3 scripts/capture_private_read_study_neon_state.py --output reports/private-read-study/neon-before.json
      - name: Observe one paired fixed-route read without database credentials
        if: ${{ steps.window.outputs.eligible == 'true' }}
        id: probe
        continue-on-error: true
        env:
          STUDY_TRACE_ENABLED: "true"
          STUDY_TRACE_TOKEN: ${{ secrets.STUDY_TRACE_TOKEN }}
          STUDY_TRACE_USER_ID: ${{ secrets.STUDY_TRACE_USER_ID }}
          STUDY_TRACE_TEAM_ID: ${{ secrets.STUDY_TRACE_TEAM_ID }}
          STUDY_TRACE_PROJECT_ID: ${{ secrets.STUDY_TRACE_PROJECT_ID }}
          STUDY_TRACE_DEPLOYMENT_ID: ${{ secrets.STUDY_TRACE_DEPLOYMENT_ID }}
          STUDY_DEPLOYMENT_URL: ${{ secrets.STUDY_DEPLOYMENT_URL }}
          STUDY_BEARER_TOKEN: ${{ secrets.STUDY_BEARER_TOKEN }}
          STUDY_PLATFORM_BYPASS: ${{ secrets.STUDY_PLATFORM_BYPASS }}
          STUDY_DEPLOYMENT_HOST_SHA256: ${{ needs.admit-signed-slot.outputs.host_sha256 || vars.STUDY_DEPLOYMENT_HOST_SHA256 }}
          STUDY_POLICY_SHA256: ${{ needs.admit-signed-slot.outputs.policy_sha256 || vars.STUDY_POLICY_SHA256 }}
          STUDY_STARTS_AT: ${{ needs.admit-signed-slot.outputs.starts_at || vars.STUDY_STARTS_AT }}
          STUDY_EXPIRES_AT: ${{ needs.admit-signed-slot.outputs.expires_at || vars.STUDY_EXPIRES_AT }}
          STUDY_SCHEDULED_AT: ${{ needs.admit-signed-slot.outputs.scheduled_at }}
        run: python3 -m scripts.observe_private_read_study --output reports/private-read-study/observation.json
      - name: Capture endpoint state after the reads
        if: ${{ always() && steps.window.outputs.eligible == 'true' }}
        id: neon_after
        env:
          STUDY_NEON_METADATA_KEY: ${{ secrets.STUDY_NEON_METADATA_KEY }}
          STUDY_NEON_PROJECT_ID: ${{ secrets.STUDY_NEON_PROJECT_ID }}
          STUDY_NEON_ENDPOINT_ID: ${{ secrets.STUDY_NEON_ENDPOINT_ID }}
        run: python3 scripts/capture_private_read_study_neon_state.py --output reports/private-read-study/neon-after.json
      - name: Correlate provider state with the read pair
        if: ${{ always() && steps.window.outputs.eligible == 'true' && steps.neon_after.outcome == 'success' }}
        run: >-
          python3 scripts/capture_private_read_study_neon_state.py
          --annotate reports/private-read-study/observation.json
          --before reports/private-read-study/neon-before.json
          --after reports/private-read-study/neon-after.json
          --output reports/private-read-study/correlated-observation.json
      - name: Validate and hash the body-free operational receipt
        id: receipt
        if: ${{ always() && steps.window.outputs.eligible == 'true' }}
        run: |
          python3 scripts/validate_redacted_artifacts.py --root reports/private-read-study
          sha256sum reports/private-read-study/*.json > reports/private-read-study/SHA256SUMS
      - name: Retain the observation including failed attempts
        if: ${{ always() && steps.window.outputs.eligible == 'true' && steps.receipt.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: private-read-study-${{ github.run_id }}-${{ github.run_attempt }}
          path: reports/private-read-study/
          if-no-files-found: error
          retention-days: 14
      - name: Preserve failure status
        if: ${{ always() && steps.window.outputs.eligible == 'true' && steps.probe.outcome != 'success' }}
        run: exit 1

  stop-failed-study:
    if: ${{ failure() && needs.observe.result == 'failure' }}
    needs: observe
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    permissions:
      actions: write
    steps:
      # This job receives no study, provider or database credential.
      - name: Disable this observer after a failed probe or receipt
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow disable observe-private-read-study.yml --repo "$GITHUB_REPOSITORY"

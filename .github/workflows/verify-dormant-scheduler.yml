name: Verify dormant scheduler credentials

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-dormant-scheduler
  cancel-in-progress: false

jobs:
  verify:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment:
      name: scheduler
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Check only the approved dormant Worker
        id: verify
        continue-on-error: true
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          EXPECTED_WORKER_ID: d8be7a3ac48547e98a48e99f1eb145a1
          EXPECTED_ACCOUNT_SHA256: d55626b5e28b4d2ac50ff058e39cd722f2779d300ca7db10f76e3e3d7966d386
        run: node ops/scheduler/verify-dormant-credentials.mjs reports/scheduler-credentials/verification.json
      - name: Validate redacted receipt
        id: redaction
        if: ${{ always() }}
        run: python3 scripts/validate_redacted_artifacts.py --root reports/scheduler-credentials
      - name: Hash receipt
        id: hash
        if: ${{ always() && steps.redaction.outcome == 'success' }}
        run: sha256sum reports/scheduler-credentials/verification.json > reports/scheduler-credentials/SHA256SUMS
      - name: Retain redacted credential evidence
        if: ${{ always() && steps.redaction.outcome == 'success' && steps.hash.outcome == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dormant-scheduler-credentials-${{ github.run_id }}-${{ github.run_attempt }}
          path: reports/scheduler-credentials/
          if-no-files-found: error
          retention-days: 7
      - name: Fail unless credential check passed
        if: ${{ always() && (steps.verify.outcome != 'success' || steps.redaction.outcome != 'success' || steps.hash.outcome != 'success') }}
        run: exit 1

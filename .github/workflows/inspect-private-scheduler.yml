name: Inspect replacement scheduler metadata

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-forward-scheduler
  cancel-in-progress: false

jobs:
  inspect:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    environment:
      name: scheduler
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Verify diagnostic contract offline
        run: node --test ops/scheduler/inspect-private-cron-events.test.mjs
      - name: Verify existing active private Worker metadata
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node ops/scheduler/manage-private-scheduler.mjs VERIFY_ACTIVE reports/private-scheduler-inspection/state.json
      - name: Inspect replacement delivery probe events once
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node ops/scheduler/inspect-private-cron-events.mjs reports/private-scheduler-inspection/events.json replacement-20261114
      - name: Validate and hash body-free receipts including refusals
        id: receipt
        if: ${{ always() }}
        run: |
          python3 scripts/validate_redacted_artifacts.py --root reports/private-scheduler-inspection
          sha256sum reports/private-scheduler-inspection/*.json > reports/private-scheduler-inspection/SHA256SUMS
      - name: Retain diagnostic receipts
        if: ${{ always() && steps.receipt.outcome == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: private-scheduler-inspection-${{ github.run_id }}-${{ github.run_attempt }}
          path: reports/private-scheduler-inspection/
          if-no-files-found: error
          retention-days: 14

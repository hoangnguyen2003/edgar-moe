name: Prospective forward cycle

on:
  schedule:
    # 07:17 UTC Tuesday-Saturday is after the prior U.S. SEC acceptance window
    # and leaves at least six hours before the next regular NYSE open.
    - cron: "17 7 * * 2-6"
  workflow_dispatch:
    inputs:
      cutoff:
        description: Optional source-system cutoff (YYYY-MM-DD)
        required: false
        type: string
      device:
        description: Inference device
        required: true
        default: cpu
        type: choice
        options: [cpu]

permissions:
  contents: read

concurrency:
  group: edgar-moe-forward-production
  cancel-in-progress: false

jobs:
  forecast-and-settle:
    runs-on: ubuntu-24.04
    # The inner compute deadline leaves a full hour to persist resumable caches.
    timeout-minutes: 360
    env:
      ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
      ALPACA_API_SECRET: ${{ secrets.ALPACA_API_SECRET }}
      FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
      SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
      EDGAR_MOE_REGISTRY_DATABASE_URL: ${{ secrets.EDGAR_MOE_REGISTRY_DATABASE_URL }}
      EDGAR_MOE_ARTIFACT_BACKEND: local
      EDGAR_MOE_ARTIFACT_MIRROR_BACKEND: r2
      EDGAR_MOE_ARTIFACT_DIR: data/forward/artifacts
      EDGAR_MOE_R2_ENDPOINT_URL: ${{ secrets.EDGAR_MOE_R2_ENDPOINT_URL }}
      EDGAR_MOE_R2_BUCKET: ${{ secrets.EDGAR_MOE_R2_BUCKET }}
      EDGAR_MOE_R2_ACCESS_KEY_ID: ${{ secrets.EDGAR_MOE_R2_ACCESS_KEY_ID }}
      EDGAR_MOE_R2_SECRET_ACCESS_KEY: ${{ secrets.EDGAR_MOE_R2_SECRET_ACCESS_KEY }}
      EDGAR_MOE_REGISTRY_AUDITOR_DATABASE_URL: ${{ secrets.EDGAR_MOE_REGISTRY_AUDITOR_DATABASE_URL }}
      EDGAR_MOE_R2_AUDITOR_ACCESS_KEY_ID: ${{ secrets.EDGAR_MOE_R2_AUDITOR_ACCESS_KEY_ID }}
      EDGAR_MOE_R2_AUDITOR_SECRET_ACCESS_KEY: ${{ secrets.EDGAR_MOE_R2_AUDITOR_SECRET_ACCESS_KEY }}
      EDGAR_MOE_ALERT_WEBHOOK_URL: ${{ secrets.EDGAR_MOE_ALERT_WEBHOOK_URL }}
      HF_HOME: ${{ github.workspace }}/data/cache/huggingface
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Set up Go evidence auditor (optional)
        if: ${{ env.EDGAR_MOE_REGISTRY_AUDITOR_DATABASE_URL != '' }}
        uses: actions/setup-go@v6
        with:
          go-version-file: tools/evidence-auditor/go.mod
          cache-dependency-path: tools/evidence-auditor/go.sum

      - name: Install frozen research and operations runtime
        run: uv sync --extra research --extra operations

      - name: Require every private runtime secret
        shell: bash
        run: |
          required=(
            ALPACA_API_KEY ALPACA_API_SECRET FRED_API_KEY SEC_USER_AGENT
            EDGAR_MOE_REGISTRY_DATABASE_URL EDGAR_MOE_R2_ENDPOINT_URL
            EDGAR_MOE_R2_BUCKET EDGAR_MOE_R2_ACCESS_KEY_ID
            EDGAR_MOE_R2_SECRET_ACCESS_KEY
          )
          missing=()
          for name in "${required[@]}"; do
            if [[ -z "${!name:-}" ]]; then
              missing+=("$name")
            fi
          done
          if (( ${#missing[@]} )); then
            printf 'Missing required GitHub Actions secrets: %s\n' "${missing[*]}" >&2
            exit 1
          fi

      - name: Resolve the U.S. source cutoff
        id: cutoff
        shell: bash
        env:
          REQUESTED_CUTOFF: ${{ inputs.cutoff }}
        run: |
          if [[ -n "$REQUESTED_CUTOFF" ]]; then
            cutoff="$(uv run python scripts/run_forward_cycle.py --print-cutoff --cutoff "$REQUESTED_CUTOFF")"
          else
            cutoff="$(uv run python scripts/run_forward_cycle.py --print-cutoff)"
          fi
          echo "date=$cutoff" >> "$GITHUB_OUTPUT"
          echo "Source cutoff: $cutoff"

      - name: Restore immutable filing and embedding caches
        id: runtime_cache
        uses: actions/cache/restore@v5
        with:
          path: |
            data/cache/forward-filings
            data/artifacts/embedding-cache-finbert
            ${{ env.HF_HOME }}
          key: forward-runtime-${{ runner.os }}-${{ steps.cutoff.outputs.date }}-${{ hashFiles('uv.lock', 'config/authenticated-free.yaml', 'config/universe.research.csv') }}
          restore-keys: |
            forward-runtime-${{ runner.os }}-

      - name: Restore and verify the reviewed frozen model
        shell: bash
        run: |
          sha256sum -c ops/frozen/SHA256SUMS
          destination=data/artifacts/frozen-studies/research-2026-07-31-3553e7ad78dd
          mkdir -p "$destination"
          install -m 0644 ops/frozen/frozen-model.pt "$destination/frozen-model.pt"
          install -m 0644 ops/frozen/locked-test.json "$destination/locked-test.json"

      - name: Refresh, forecast, and settle append-only evidence
        id: forward_cycle
        run: >-
          timeout --signal=INT --kill-after=30s 300m
          uv run python scripts/run_forward_cycle.py
          --cutoff "${{ steps.cutoff.outputs.date }}"
          --device "${{ inputs.device || 'cpu' }}"
          --diagnostic-output
          "data/forward/diagnostics/diagnostic-${{ steps.cutoff.outputs.date }}.json"

      - name: Audit R2 evidence after cycle (optional)
        id: evidence_audit
        if: ${{ always() && !cancelled() && env.EDGAR_MOE_REGISTRY_AUDITOR_DATABASE_URL != '' }}
        working-directory: tools/evidence-auditor
        env:
          AUDITOR_DATABASE_URL: ${{ env.EDGAR_MOE_REGISTRY_AUDITOR_DATABASE_URL }}
          AUDITOR_R2_ENDPOINT_URL: ${{ env.EDGAR_MOE_R2_ENDPOINT_URL }}
          AUDITOR_R2_BUCKET: ${{ env.EDGAR_MOE_R2_BUCKET }}
          AUDITOR_R2_ACCESS_KEY_ID: ${{ env.EDGAR_MOE_R2_AUDITOR_ACCESS_KEY_ID }}
          AUDITOR_R2_SECRET_ACCESS_KEY: ${{ env.EDGAR_MOE_R2_AUDITOR_SECRET_ACCESS_KEY }}
        shell: bash
        run: |
          mkdir -p ../../data/forward/diagnostics
          set +e
          go run . -timeout 5m -stale-after 96h > ../../data/forward/diagnostics/evidence-audit.json
          audit_code=$?
          cat ../../data/forward/diagnostics/evidence-audit.json
          exit "$audit_code"

      - name: Upload evidence-audit report (optional)
        if: ${{ always() && !cancelled() && steps.evidence_audit.outcome != 'skipped' }}
        uses: actions/upload-artifact@v7
        with:
          name: forward-evidence-audit-${{ github.run_id }}-${{ github.run_attempt }}
          path: data/forward/diagnostics/evidence-audit.json
          if-no-files-found: ignore
          retention-days: 30

      - name: Capture failed-cycle context
        if: ${{ always() && !cancelled() && (steps.forward_cycle.outcome != 'success' || steps.evidence_audit.outcome == 'failure') }}
        env:
          CUTOFF: ${{ steps.cutoff.outputs.date }}
          CYCLE_OUTCOME: ${{ steps.evidence_audit.outcome == 'failure' && 'evidence_audit_failure' || steps.forward_cycle.outcome }}
          DEVICE: ${{ inputs.device || 'cpu' }}
          EDGAR_MOE_FAILURE_CONTEXT_PATH: data/forward/diagnostics/forward-failure-context.json
        shell: bash
        run: |
          uv run python scripts/write_forward_failure_context.py

      - name: Notify failed cycle (optional)
        if: ${{ always() && !cancelled() && (steps.forward_cycle.outcome != 'success' || steps.evidence_audit.outcome == 'failure') && env.EDGAR_MOE_ALERT_WEBHOOK_URL != '' }}
        continue-on-error: true
        env:
          EDGAR_MOE_FAILURE_CONTEXT_PATH: data/forward/diagnostics/forward-failure-context.json
          EDGAR_MOE_ALERT_RECEIPT_PATH: data/forward/diagnostics/forward-alert-receipt.json
        shell: bash
        run: uv run python scripts/notify_forward_alert.py

      - name: Upload failure evidence
        if: ${{ always() && !cancelled() && (steps.forward_cycle.outcome != 'success' || steps.evidence_audit.outcome == 'failure') }}
        uses: actions/upload-artifact@v7
        with:
          name: forward-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            data/forward/diagnostics/forward-failure-context.json
            data/forward/diagnostics/diagnostic-${{ steps.cutoff.outputs.date }}.json
            data/forward/diagnostics/forward-alert-receipt.json
            data/forward/diagnostics/evidence-audit.json
          if-no-files-found: ignore
          retention-days: 30

      - name: Publish failure summary
        if: ${{ always() && !cancelled() && (steps.forward_cycle.outcome != 'success' || steps.evidence_audit.outcome == 'failure') }}
        shell: bash
        env:
          CUTOFF: ${{ steps.cutoff.outputs.date }}
          CYCLE_OUTCOME: ${{ steps.forward_cycle.outcome }}
        run: |
          {
            echo '## Prospective cycle failure'
            echo "- Cutoff: \`$CUTOFF\`"
            echo "- Cycle outcome: \`$CYCLE_OUTCOME\`"
            echo "- Evidence audit outcome: \`${{ steps.evidence_audit.outcome }}\`"
            echo "- Run: \`${GITHUB_RUN_ID}\` (attempt \`${GITHUB_RUN_ATTEMPT}\`)"
            echo '- Failure context was uploaded as a 30-day artifact.'
            echo '- The registry run remains immutable; investigate and retry with a new run identity.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload short-horizon diagnostic
        if: ${{ always() && !cancelled() && steps.forward_cycle.outcome == 'success' && steps.evidence_audit.outcome != 'failure' }}
        uses: actions/upload-artifact@v7
        with:
          name: forward-diagnostic-${{ steps.cutoff.outputs.date }}
          path: data/forward/diagnostics/diagnostic-${{ steps.cutoff.outputs.date }}.json
          if-no-files-found: error
          retention-days: 30

      - name: Capture registry health status (optional)
        if: ${{ always() && !cancelled() && steps.forward_cycle.outcome == 'success' && steps.evidence_audit.outcome != 'failure' && env.EDGAR_MOE_ALERT_WEBHOOK_URL != '' }}
        shell: bash
        run: |
          status_path=data/forward/diagnostics/forward-status.json
          mkdir -p "$(dirname "$status_path")"
          if ! uv run edgar-moe forward-status > "$status_path"; then
            printf '%s\n' '{"available":false,"error":"registry_status_command_failed"}' > "$status_path"
          fi

      - name: Notify registry health (optional)
        if: ${{ always() && !cancelled() && steps.forward_cycle.outcome == 'success' && steps.evidence_audit.outcome != 'failure' && env.EDGAR_MOE_ALERT_WEBHOOK_URL != '' }}
        continue-on-error: true
        env:
          EDGAR_MOE_ALERT_RECEIPT_PATH: data/forward/diagnostics/forward-alert-receipt.json
        shell: bash
        run: uv run python scripts/notify_forward_alert.py --status-file data/forward/diagnostics/forward-status.json

      - name: Upload optional health alert evidence
        if: ${{ always() && !cancelled() && steps.forward_cycle.outcome == 'success' && steps.evidence_audit.outcome != 'failure' && env.EDGAR_MOE_ALERT_WEBHOOK_URL != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: forward-health-alert-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            data/forward/diagnostics/forward-status.json
            data/forward/diagnostics/forward-alert-receipt.json
          if-no-files-found: ignore
          retention-days: 30

      - name: Write and verify forward evidence manifest
        if: ${{ always() && !cancelled() }}
        env:
          WORKFLOW: forward-production
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          COMMIT: ${{ github.sha }}
          REF: ${{ github.ref }}
          CUTOFF: ${{ steps.cutoff.outputs.date }}
          CYCLE_OUTCOME: ${{ steps.evidence_audit.outcome == 'failure' && 'evidence_audit_failure' || steps.forward_cycle.outcome }}
          DEVICE: ${{ inputs.device || 'cpu' }}
        shell: bash
        run: |
          set -euo pipefail
          uv run python scripts/write_forward_evidence_manifest.py \
            --root . \
            --output data/forward/diagnostics/forward-evidence-manifest.json \
            --path data/forward/diagnostics/forward-failure-context.json \
            --path "data/forward/diagnostics/diagnostic-${{ steps.cutoff.outputs.date }}.json" \
            --path data/forward/diagnostics/evidence-audit.json \
            --path data/forward/diagnostics/forward-status.json \
            --path data/forward/diagnostics/forward-alert-receipt.json
          uv run python scripts/verify_forward_evidence_manifest.py \
            --root . \
            --manifest data/forward/diagnostics/forward-evidence-manifest.json

      - name: Upload forward evidence manifest
        if: ${{ always() && !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: forward-evidence-manifest-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            data/forward/diagnostics/forward-evidence-manifest.json
            data/forward/diagnostics/forward-failure-context.json
            data/forward/diagnostics/diagnostic-${{ steps.cutoff.outputs.date }}.json
            data/forward/diagnostics/evidence-audit.json
            data/forward/diagnostics/forward-status.json
            data/forward/diagnostics/forward-alert-receipt.json
          if-no-files-found: error
          retention-days: 30

      - name: Save resumable filing and embedding caches
        if: ${{ always() && steps.runtime_cache.outcome == 'success' }}
        uses: actions/cache/save@v5
        with:
          path: |
            data/cache/forward-filings
            data/artifacts/embedding-cache-finbert
            ${{ env.HF_HOME }}
          key: forward-runtime-${{ runner.os }}-${{ steps.cutoff.outputs.date }}-${{ github.run_id }}-${{ github.run_attempt }}-${{ hashFiles('uv.lock', 'config/authenticated-free.yaml', 'config/universe.research.csv') }}

      - name: Publish registry summary
        if: success()
        shell: bash
        run: |
          {
            echo '## Prospective registry status'
            echo '```json'
            uv run edgar-moe forward-status
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

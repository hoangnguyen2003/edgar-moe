name: Weekly research refresh

on:
  schedule:
    - cron: "20 14 * * 6"
  workflow_dispatch:
    inputs:
      mode:
        description: Refresh mode
        type: choice
        options: [demo, authenticated-data]
        default: demo

permissions:
  contents: read

jobs:
  demo-snapshot:
    if: github.event_name == 'schedule' || inputs.mode == 'demo'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.12"
          enable-cache: true
          # torch and CUDA wheels are ~3 GB; pruning keeps this cache small
          # (setup-uv v9 stopped pruning by default).
          prune-cache: true
      - run: uv sync --locked --extra research
      - name: Build transparent verification snapshot
        run: uv run edgar-moe demo --epochs 12 --output /tmp/edgar-moe-synthetic.json
      - name: Validate snapshot API
        run: uv run python scripts/validate_snapshot.py /tmp/edgar-moe-synthetic.json

  provider-use-review:
    name: Authenticated refresh held pending issue 280
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'authenticated-data'
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    permissions: {}
    steps:
      - name: Enforce the documented source-use hold
        shell: bash
        run: |
          printf '%s\n' 'Authenticated provider ingestion is held pending source-rights issue #280. No provider credentials are read and no refresh is started. Reopening requires a reviewed PR after source-specific written clearance or an approved replacement.' >> "$GITHUB_STEP_SUMMARY"
          exit 1

  authenticated-data:
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'authenticated-data'
    needs: provider-use-review
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.12"
          enable-cache: true
          # torch and CUDA wheels are ~3 GB; pruning keeps this cache small
          # (setup-uv v9 stopped pruning by default).
          prune-cache: true
      - run: uv sync --locked --extra research
      - name: Require reviewed research universe
        run: test -f config/universe.research.csv
      - name: Check authenticated-source configuration
        id: credentials
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_API_SECRET: ${{ secrets.ALPACA_API_SECRET }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: |
          if [[ -n "$ALPACA_API_KEY" && -n "$ALPACA_API_SECRET" && -n "$FRED_API_KEY" && -n "$SEC_USER_AGENT" ]]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "Authenticated refresh skipped because repository secrets are incomplete."
          fi
      - name: Collect point-in-time research inputs
        if: steps.credentials.outputs.available == 'true'
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_API_SECRET: ${{ secrets.ALPACA_API_SECRET }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: >-
          uv run edgar-moe refresh-data
          --universe config/universe.research.csv
          --config config/authenticated-free.yaml
          --resume
      - name: Retain private authenticated bundle
        if: steps.credentials.outputs.available == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: authenticated-research-inputs-${{ github.run_id }}
          path: data/raw/authenticated
          retention-days: 7
          if-no-files-found: error

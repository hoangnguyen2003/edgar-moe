name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --locked --extra dev --extra research --extra operations
      - run: uv run ruff check .
      - run: uv run mypy src
      - run: uv run pytest --cov=edgar_moe --cov-report=term-missing --cov-fail-under=80
      - name: Check the reader-role audit command is runnable
        run: uv run python scripts/verify_postgres_reader.py --help
      - name: Check restore comparison command is runnable
        run: uv run python scripts/compare_restore_reports.py --help
      - name: Check restore comparison verifier is runnable
        run: uv run python scripts/verify_restore_comparison.py --help
      - name: Check local restore rehearsal command is runnable
        run: uv run python scripts/rehearse_sqlite_restore.py --help
      - name: Check PostgreSQL restore fixture commands are runnable
        run: |
          uv run python scripts/seed_forward_restore_fixture.py --help
          uv run python scripts/export_forward_registry_counts.py --help
      - name: Check forward failure context writer is runnable
        run: uv run python scripts/write_forward_failure_context.py
      - name: Check optional forward alert notifier is runnable
        run: uv run python scripts/notify_forward_alert.py --help
      - name: Check forward alert receipt verifier is runnable
        run: uv run python scripts/verify_forward_alert_receipt.py --help
      - name: Check forward evidence manifest commands are runnable
        run: |
          uv run python scripts/write_forward_evidence_manifest.py --help
          uv run python scripts/verify_forward_evidence_manifest.py --help
      - name: Check operator evidence packet commands are runnable
        run: |
          uv run python scripts/write_operator_evidence_packet.py --help
          uv run python scripts/verify_operator_evidence_packet.py --help
          uv run python scripts/check_operator_readiness.py --help
      - name: Check retained evidence redaction command is runnable
        run: uv run python scripts/validate_redacted_artifacts.py --help
      - name: Check artifact reconciliation command is runnable
        run: uv run edgar-moe forward-reconcile-artifacts --help
      - name: Check capacity baseline command is runnable
        run: uv run edgar-moe capacity-baseline --help
      - name: Check research drift command is runnable
        run: uv run edgar-moe research-drift --help
      - name: Check research drift history command is runnable
        run: uv run edgar-moe research-drift-history --help
      - name: Check deployment smoke command is runnable
        run: uv run python scripts/smoke_deployment.py --help
      - name: Verify immutable public snapshot lock
        run: uv run python scripts/verify_public_snapshot_lock.py
      - name: Verify frozen v1 runtime bundle identity
        run: uv run python scripts/validate_frozen_runtime.py
      - name: Verify forward-registry migrations match the ORM schema
        env:
          EDGAR_MOE_REGISTRY_DATABASE_URL: sqlite:////tmp/edgar-moe-migration-check.sqlite3
        run: |
          uv run alembic upgrade head
          uv run alembic check

  postgres-reader-role:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: edgar_moe
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d edgar_moe"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --locked --extra dev
      - name: Apply registry schema as the migration owner
        env:
          EDGAR_MOE_REGISTRY_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/edgar_moe
        run: uv run alembic upgrade head
      - name: Provision the disposable SELECT-only role
        env:
          EDGAR_MOE_REGISTRY_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/edgar_moe
        shell: bash
        run: |
          psql "$EDGAR_MOE_REGISTRY_DATABASE_URL" \
            --set ON_ERROR_STOP=1 \
            --command "CREATE ROLE edgar_moe_migrator NOLOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE;"
          psql "$EDGAR_MOE_REGISTRY_DATABASE_URL" \
            --set ON_ERROR_STOP=1 \
            --command "CREATE ROLE edgar_moe_api_reader LOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT PASSWORD 'reader-password';"
          psql "$EDGAR_MOE_REGISTRY_DATABASE_URL" \
            --set ON_ERROR_STOP=1 \
            --variable api_reader_role=edgar_moe_api_reader \
            --variable migration_owner=edgar_moe_migrator \
            --file ops/postgres/provision-reader.sql
      - name: Verify effective PostgreSQL reader privileges and denied writes
        env:
          EDGAR_MOE_REGISTRY_READ_DATABASE_URL: postgresql://edgar_moe_api_reader:reader-password@127.0.0.1:5432/edgar_moe
        run: uv run python scripts/verify_postgres_reader.py

  postgres-restore-rehearsal:
    runs-on: ubuntu-24.04
    env:
      SOURCE_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/edgar_moe
      RESTORE_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/edgar_moe_restored
      REHEARSAL_DIR: ${{ github.workspace }}/reports/postgres-restore
      RESTORE_ARTIFACT_ROOT: ${{ github.workspace }}/reports/postgres-restore/artifacts
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: edgar_moe
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d edgar_moe"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: true
      - uses: actions/setup-go@v6
        with:
          go-version-file: tools/evidence-auditor/go.mod
          cache-dependency-path: tools/evidence-auditor/go.sum
      - run: uv sync --locked --extra dev
      - name: Prepare isolated rehearsal directories
        run: mkdir -p "$REHEARSAL_DIR" "$RESTORE_ARTIFACT_ROOT"
      - name: Apply schema and seed a representative registry
        env:
          EDGAR_MOE_REGISTRY_DATABASE_URL: ${{ env.SOURCE_DATABASE_URL }}
        run: |
          set -euo pipefail
          uv run alembic upgrade head
          uv run python scripts/seed_forward_restore_fixture.py \
            --database-url "$SOURCE_DATABASE_URL" \
            --artifact-root "$RESTORE_ARTIFACT_ROOT" \
            --allow-synthetic \
            > "$REHEARSAL_DIR/seed.json"
      - name: Export source table counts
        run: uv run python scripts/export_forward_registry_counts.py --database-url "$SOURCE_DATABASE_URL" --output "$REHEARSAL_DIR/source-counts.json"
      - name: Audit source registry and evidence
        working-directory: tools/evidence-auditor
        env:
          AUDITOR_DATABASE_URL: ${{ env.SOURCE_DATABASE_URL }}
        run: go run . -local-root "$RESTORE_ARTIFACT_ROOT" -timeout 5m -stale-after 96h > "$REHEARSAL_DIR/source-evidence-audit.json"
      - name: Dump source and restore into a new database
        shell: bash
        run: |
          set -euo pipefail
          pg_dump --format=custom --no-owner \
            --file="$REHEARSAL_DIR/registry.dump" "$SOURCE_DATABASE_URL"
          psql "$SOURCE_DATABASE_URL" --set ON_ERROR_STOP=1 \
            --command "CREATE DATABASE edgar_moe_restored"
          restore_started="$(date +%s)"
          pg_restore --no-owner --exit-on-error \
            --dbname="$RESTORE_DATABASE_URL" "$REHEARSAL_DIR/registry.dump"
          restore_finished="$(date +%s)"
          printf '{"restore_elapsed_seconds":%s}\n' \
            "$((restore_finished - restore_started))" \
            > "$REHEARSAL_DIR/timing.json"
      - name: Check restored schema and export counts
        env:
          EDGAR_MOE_REGISTRY_DATABASE_URL: ${{ env.RESTORE_DATABASE_URL }}
        run: |
          set -euo pipefail
          uv run alembic check
          uv run python scripts/export_forward_registry_counts.py \
            --database-url "$RESTORE_DATABASE_URL" \
            --output "$REHEARSAL_DIR/restored-counts.json"
      - name: Audit restored registry and evidence
        working-directory: tools/evidence-auditor
        env:
          AUDITOR_DATABASE_URL: ${{ env.RESTORE_DATABASE_URL }}
        run: go run . -local-root "$RESTORE_ARTIFACT_ROOT" -timeout 5m -stale-after 96h > "$REHEARSAL_DIR/restored-evidence-audit.json"
      - name: Compare source and restored evidence
        run: |
          set -euo pipefail
          uv run python scripts/compare_restore_reports.py \
            --source-counts "$REHEARSAL_DIR/source-counts.json" \
            --restored-counts "$REHEARSAL_DIR/restored-counts.json" \
            --source-audit "$REHEARSAL_DIR/source-evidence-audit.json" \
            --restored-audit "$REHEARSAL_DIR/restored-evidence-audit.json" \
            | tee "$REHEARSAL_DIR/restore-comparison.json"
          uv run python scripts/verify_restore_comparison.py \
            --report "$REHEARSAL_DIR/restore-comparison.json"
      - name: Probe the restored read path
        env:
          EDGAR_MOE_REGISTRY_READ_DATABASE_URL: ${{ env.RESTORE_DATABASE_URL }}
        run: |
          uv run python - <<'PY'
          import os

          from edgar_moe.forward.database import RegistryDatabase
          from edgar_moe.forward.registry import ForwardRegistry

          database = RegistryDatabase(os.environ["EDGAR_MOE_REGISTRY_READ_DATABASE_URL"])
          try:
              registry = ForwardRegistry(database, actor="restore-rehearsal-read-probe")
              status = registry.status()
              forecasts = registry.list_forecasts(limit=1)
              assert status["health_status"] == "ok", status
              assert status["run_count"] == 1, status
              assert forecasts["total"] == 1, forecasts
              assert registry.performance()["forecast_count"] == 1
          finally:
              database.dispose()
          PY
      - name: Upload restore rehearsal evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: postgres-restore-rehearsal-${{ github.run_id }}
          path: reports/postgres-restore/
          if-no-files-found: ignore
          retention-days: 30

  web:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
        working-directory: apps/web
      - run: npm run lint
        working-directory: apps/web
      - run: npm run test
        working-directory: apps/web
      - run: npm run build
        working-directory: apps/web
      - run: npm run build:public
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python scripts/validate_deployment_contract.py
      - run: python scripts/validate_public_bundle.py
      - run: python -m json.tool vercel.json >/dev/null
      - run: git diff --exit-code -- public

  container:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Build the reproducible serving image
        run: docker build --tag edgar-moe-ci:${{ github.sha }} .
      - name: Smoke-test the non-root container
        shell: bash
        run: |
          set -euo pipefail
          container_id="$(docker run --detach --publish 18000:8000 edgar-moe-ci:${GITHUB_SHA})"
          cleanup() { docker rm --force "$container_id" >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          for _ in $(seq 1 30); do
            if curl --fail --silent --show-error \
              http://127.0.0.1:18000/api/v1/health >/tmp/edgar-moe-container-health.json; then
              break
            fi
            sleep 1
          done
          test -s /tmp/edgar-moe-container-health.json
          test "$(docker inspect --format '{{.Config.User}}' "$container_id")" = "app"
          for _ in $(seq 1 30); do
            health="$(docker inspect --format '{{json .State.Health.Status}}' "$container_id")"
            if [[ "$health" == '"healthy"' ]]; then
              exit 0
            fi
            sleep 1
          done
          docker inspect "$container_id"
          exit 1

  evidence-auditor:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: tools/evidence-auditor
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: tools/evidence-auditor/go.mod
          cache-dependency-path: tools/evidence-auditor/go.sum
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test -race ./...

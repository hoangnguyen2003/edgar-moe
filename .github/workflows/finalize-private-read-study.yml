name: Finalize bounded private read study

on:
  workflow_dispatch:
  schedule:
    - cron: "27 * * * *"

permissions:
  contents: read
  actions: read

concurrency:
  group: portfolio-private-study290-finalization
  cancel-in-progress: false

jobs:
  report:
    if: ${{ github.ref == 'refs/heads/main' && vars.ISSUE290_STUDY_ENABLED == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: hosted-read-study
    outputs:
      finished: ${{ steps.report.outputs.finished }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Finalize only after the absolute window and in-flight job grace
        id: report
        env:
          GH_TOKEN: ${{ github.token }}
          STUDY_STARTS_AT: ${{ vars.STUDY_STARTS_AT }}
          STUDY_EXPIRES_AT: ${{ vars.STUDY_EXPIRES_AT }}
          STUDY_POLICY_SHA256: ${{ vars.STUDY_POLICY_SHA256 }}
          STUDY_DEPLOYMENT_HOST_SHA256: ${{ vars.STUDY_DEPLOYMENT_HOST_SHA256 }}
        run: python3 scripts/finalize_private_read_study.py --output-dir reports/private-read-study-final
      - name: Validate and hash the final evidence packet
        if: ${{ steps.report.outputs.finished == 'true' }}
        run: |
          python3 scripts/validate_redacted_artifacts.py --root reports/private-read-study-final
          find reports/private-read-study-final -type f -name '*.json' -print0 | sort -z | xargs -0 sha256sum > reports/private-read-study-final/SHA256SUMS
      - name: Retain final comparison and all original receipts
        if: ${{ steps.report.outputs.finished == 'true' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: private-read-study-final-${{ github.run_id }}
          path: reports/private-read-study-final/
          if-no-files-found: error
          retention-days: 90

  stop-finished-study:
    if: ${{ needs.report.result == 'success' && needs.report.outputs.finished == 'true' }}
    needs: report
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    permissions:
      actions: write
    steps:
      - name: Stop only these two bounded study workflows
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow disable observe-private-read-study.yml --repo "$GITHUB_REPOSITORY"
          gh workflow disable finalize-private-read-study.yml --repo "$GITHUB_REPOSITORY"

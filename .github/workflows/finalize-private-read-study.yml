name: Finalize bounded private read study

on:
  workflow_dispatch:
  schedule:
    - cron: "27 * * * *"

permissions:
  contents: read
  actions: read

concurrency:
  group: portfolio-private-study290-finalization
  cancel-in-progress: false

jobs:
  report:
    if: ${{ github.ref == 'refs/heads/main' && vars.ISSUE290_STUDY_ENABLED == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: hosted-read-study
    outputs:
      finished: ${{ steps.report.outputs.finished }}
      starts_at: ${{ steps.report.outputs.starts_at }}
      expires_at: ${{ steps.report.outputs.expires_at }}
      policy_sha256: ${{ steps.report.outputs.policy_sha256 }}
      host_sha256: ${{ steps.report.outputs.host_sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Finalize only after the absolute window and in-flight job grace
        id: report
        env:
          GH_TOKEN: ${{ github.token }}
          STUDY_STARTS_AT: ${{ vars.STUDY_STARTS_AT }}
          STUDY_EXPIRES_AT: ${{ vars.STUDY_EXPIRES_AT }}
          STUDY_POLICY_SHA256: ${{ vars.STUDY_POLICY_SHA256 }}
          STUDY_DEPLOYMENT_HOST_SHA256: ${{ vars.STUDY_DEPLOYMENT_HOST_SHA256 }}
          STUDY_DELIVERY_MODE: ${{ vars.ISSUE290_STUDY_DELIVERY_MODE }}
        run: python3 -m scripts.finalize_private_read_study --output-dir reports/private-read-study-final
      - name: Validate and hash the final evidence packet
        if: ${{ steps.report.outputs.finished == 'true' }}
        run: |
          python3 scripts/validate_redacted_artifacts.py --root reports/private-read-study-final
          find reports/private-read-study-final -type f -name '*.json' -print0 | sort -z | xargs -0 sha256sum > reports/private-read-study-final/SHA256SUMS
      - name: Retain final comparison and all original receipts
        if: ${{ steps.report.outputs.finished == 'true' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: private-read-study-final-${{ github.run_id }}
          path: reports/private-read-study-final/
          if-no-files-found: error
          retention-days: 90

  stop-observation-cron:
    needs: report
    if: ${{ needs.report.result == 'success' && needs.report.outputs.finished == 'true' && vars.ISSUE290_STUDY_DELIVERY_MODE == 'cloudflare' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: hosted-study-delivery
    concurrency:
      group: manage-issue290-external-delivery
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Remove Cron only for the retained study window
        env:
          STUDY_DELIVERY_STAGE: STOP_OBSERVATION_EXPIRED
          STUDY_DELIVERY_CLOUDFLARE_ACCOUNT_ID: ${{ secrets.STUDY_DELIVERY_CLOUDFLARE_ACCOUNT_ID }}
          STUDY_DELIVERY_CLOUDFLARE_TOKEN: ${{ secrets.STUDY_DELIVERY_CLOUDFLARE_TOKEN }}
          STUDY_OBSERVATION_STARTS_AT: ${{ needs.report.outputs.starts_at }}
          STUDY_OBSERVATION_EXPIRES_AT: ${{ needs.report.outputs.expires_at }}
          STUDY_OBSERVATION_POLICY_SHA256: ${{ needs.report.outputs.policy_sha256 }}
          STUDY_OBSERVATION_HOST_SHA256: ${{ needs.report.outputs.host_sha256 }}
        run: node ops/scheduler/manage-study-delivery.mjs

  stop-finished-study:
    if: ${{ !cancelled() && needs.report.result == 'success' && needs.report.outputs.finished == 'true' && (vars.ISSUE290_STUDY_DELIVERY_MODE == '' || needs.stop-observation-cron.result == 'success') }}
    needs: [report, stop-observation-cron]
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    permissions:
      actions: write
    steps:
      - name: Stop only these two bounded study workflows
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          for workflow in observe-private-read-study.yml finalize-private-read-study.yml; do
            endpoint="repos/$GITHUB_REPOSITORY/actions/workflows/$workflow"
            state=$(gh api "$endpoint" --jq '.state')
            if [[ "$state" == active ]]; then
              if gh api --method PUT "$endpoint/disable"; then
                continue
              fi
              # Another job may have stopped the workflow since the first read.
              state=$(gh api "$endpoint" --jq '.state')
            fi
            case "$state" in
              disabled_manually|disabled_inactivity|disabled_fork) ;;
              *)
                printf 'Could not confirm shutdown of %s\n' "$workflow" >&2
                exit 1
                ;;
            esac
          done

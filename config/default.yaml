project:
  name: EDGAR-MoE
  timezone: America/New_York
  random_seed: 42

data:
  start_date: "2016-01-01"
  universe_size: 1000
  minimum_price: 5.0
  minimum_history_sessions: 252
  liquidity_lookback_sessions: 60
  sec_forms: ["10-K", "10-Q"]
  sec_requests_per_second: 8
  mapping_confidence_threshold: 0.85

features:
  text_sections: ["risk_factors", "management_discussion"]
  momentum_windows: [5, 21, 63, 126, 252]
  volatility_windows: [21, 63]
  beta_window: 252
  embedding_model: "ProsusAI/finbert"
  embedding_chunk_tokens: 510
  embedding_max_chunks: 12

model:
  hidden_dim: 64
  expert_dim: 32
  dropout: 0.15
  gate_strength: 0.25
  candidate_hidden_dims: [32, 64]
  candidate_dropouts: [0.10, 0.20]
  candidate_gate_strengths: [0.0, 0.25, 1.0]
  fundamental_anchor_weight: 0.75
  learning_rate: 0.001
  weight_decay: 0.0001
  entropy_regularization: 0.002
  expert_auxiliary_weight: 0.25
  correlation_regularization: 0.05
  batch_size: 256
  max_epochs: 80
  patience: 10

evaluation:
  development_end: "2022-12-31"
  validation_start: "2023-01-01"
  validation_end: "2024-12-31"
  test_start: "2025-01-01"
  walk_forward_years: [2023, 2024]
  horizon_sessions: 20
  embargo_sessions: 20
  minimum_split_events: 30
  bootstrap_samples: 1000

portfolio:
  gross_exposure: 1.0
  maximum_net_exposure: 0.02
  maximum_beta_exposure: 0.05
  maximum_industry_exposure: 0.05
  maximum_name_weight: 0.02
  long_quantile: 0.9
  short_quantile: 0.1
  base_transaction_cost_bps: 10
  base_borrow_cost_annual: 0.02

services:
  terminal:
    build: .
    ports:
      - "8000:8000"
    environment:
      EDGAR_MOE_DEMO_SNAPSHOT: /app/data/demo/snapshot.json
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
